version: "3.9"

services:
  backend:
    image: python:3.11
    working_dir: /app
    depends_on:
      - postgres
    ports:
      - "8000:8000"
    volumes:
      - ./iot-backend:/app
    env_file:
      - ./iot-backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://iot_user:iot_password@postgres:5432/iot_db
      API_BASE_URL: "192.168.137.99"
    command: >
      bash -lc "pip install -r requirements.txt &&
      uvicorn app.main:app --reload --host 0.0.0.0 --port 8000"

  frontend:
    image: node:20
    working_dir: /app
    depends_on:
      - backend
    ports:
      - "3000:3000"
    volumes:
      - ./iot-fablab:/app
    environment:
      CHOKIDAR_USEPOLLING: "true"
    command: >
      sh -lc "npm install &&
      npm run dev -- --hostname 0.0.0.0"

volumes:
  postgres_data:
