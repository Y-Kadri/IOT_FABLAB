version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: iot_postgres
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: iot_db
      POSTGRES_USER: iot_user
      POSTGRES_PASSWORD: iot_password
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    image: python:3.11
    working_dir: /app
    depends_on:
      - postgres
    ports:
      - "8000:8000"
    volumes:
      - ./iot-backend:/app
    env_file:
      - ./iot-backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://iot_user:iot_password@postgres:5432/iot_db
    command: >
      bash -lc "pip install -r requirements.txt &&
      uvicorn app.main:app --reload --host 0.0.0.0 --port 8000"

  frontend:
    image: node:20
    working_dir: /app
    depends_on:
      - backend
    ports:
      - "3000:3000"
    volumes:
      - ./iot-fablab:/app
    environment:
      CHOKIDAR_USEPOLLING: "true"
    command: >
      sh -lc "npm install &&
      npm run dev -- --hostname 0.0.0.0"

volumes:
  postgres_data:
